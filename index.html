<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reaction Timer — 3D Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0F172A;
      --surface: #1E293B;
      --text:    #F1F5F9;
      --muted:   #94A3B8;
      --ready:   #10B981;
      --waiting: #F59E0B;
      --result:  #3B82F6;
      --error:   #EF4444;
    }

    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #canvas3d {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; display: block;
    }

    /* ── UI root: vertical stack, centered ── */
    #ui {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.75rem; padding: 1rem;
      overflow: hidden;
    }

    /* ── Instructions block (shown only in IDLE) ── */
    #instructions {
      width: min(400px, calc(100vw - 2rem));
      text-align: center;
      transition: opacity 0.25s ease;
    }
    #instructions.hidden { display: none; }

    .game-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem; font-weight: 900;
      line-height: 1; letter-spacing: -0.025em;
      margin-bottom: 0.3rem;
      background: linear-gradient(140deg, #F1F5F9 20%, #94A3B8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-tagline {
      font-size: 0.82rem; color: var(--muted);
      margin-bottom: 0.75rem; line-height: 1.5;
    }

    .rating-guide {
      background: rgba(30,41,59,0.86);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(148,163,184,0.12);
      border-radius: 14px;
      padding: 0.7rem 1rem;
      display: flex; flex-direction: column; gap: 0.32rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .rg-row { display: flex; align-items: center; gap: 0.6rem; }
    .rg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .rg-label { flex: 1; font-size: 0.77rem; color: var(--text); font-weight: 500; }
    .rg-range { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── Game card ── */
    #card {
      width: min(400px, calc(100vw - 2rem));
      background: rgba(30,41,59,0.84);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(148,163,184,0.12);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15), 0 20px 40px rgba(0,0,0,0.38);
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
      user-select: none;
      z-index: 20; position: relative;
    }

    /* ── Game zone: the clickable area ── */
    #game-zone {
      min-height: 140px;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      cursor: default;
    }
    #game-zone.clickable { cursor: pointer; }

    /* ── State panels ── */
    .panel { display: none; }
    .panel.active {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* IDLE: subtle tap prompt */
    .idle-ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(148,163,184,0.25);
      margin-bottom: 0.6rem;
      animation: idle-pulse 2s ease-in-out infinite;
    }
    @keyframes idle-pulse {
      0%,100% { border-color: rgba(148,163,184,0.18); transform: scale(0.94); }
      50%     { border-color: rgba(148,163,184,0.48); transform: scale(1.06); }
    }
    .idle-label { font-size: 0.78rem; color: rgba(148,163,184,0.55); letter-spacing: 0.04em; }

    /* WAITING: just the spinner */
    .orbit-loader { width: 52px; height: 52px; position: relative; }
    .orbit-loader::before, .orbit-loader::after {
      content: ''; position: absolute; border-radius: 50%;
      border: 2.5px solid transparent;
    }
    .orbit-loader::before {
      inset: 0; border-top-color: var(--waiting);
      animation: spin 0.9s linear infinite;
    }
    .orbit-loader::after {
      inset: 9px; border-top-color: rgba(245,158,11,0.35);
      animation: spin 0.65s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* READY: just the beacon */
    .ready-beacon {
      width: 62px; height: 62px; border-radius: 50%;
      background: var(--ready);
      animation: beacon 0.75s ease-in-out infinite;
    }
    @keyframes beacon {
      0%   { transform: scale(1);    box-shadow: 0 0 0  0   rgba(16,185,129,0.65); }
      50%  { transform: scale(1.09); box-shadow: 0 0 0 18px rgba(16,185,129,0); }
      100% { transform: scale(1);    box-shadow: 0 0 0  0   rgba(16,185,129,0.65); }
    }

    /* RESULT */
    .result-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--result); margin-bottom: 0.1rem;
    }
    .result-number {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.8rem, 12vw, 4rem);
      font-weight: 900; line-height: 1; color: var(--result);
      letter-spacing: -0.025em;
    }
    .result-unit { font-size: 1.05rem; font-weight: 500; color: var(--muted); }
    .rating-pill {
      display: inline-block; font-size: 0.66rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.24rem 0.75rem; border-radius: 999px; margin-top: 0.55rem;
    }
    .r-elite     { background: rgba(16,185,129,0.16); color: #34D399; }
    .r-excellent { background: rgba(16,185,129,0.11); color: var(--ready); }
    .r-great     { background: rgba(59,130,246,0.16); color: var(--result); }
    .r-average   { background: rgba(245,158,11,0.16); color: var(--waiting); }
    .r-slow      { background: rgba(239,68,68,0.16);  color: var(--error); }

    /* FALSE: icon only in game-zone */
    .false-icon {
      font-size: 2rem; line-height: 1;
      filter: drop-shadow(0 0 12px rgba(239,68,68,0.5));
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    /* ── Card footer: stats + controls ── */
    #card-footer {
      border-top: 1px solid rgba(148,163,184,0.08);
      padding: 0.9rem 1.4rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.7rem;
    }

    /* False notice (bottom of card) */
    #false-notice {
      font-size: 0.78rem; font-weight: 600;
      color: var(--error);
      background: rgba(239,68,68,0.1);
      border-radius: 8px;
      padding: 0.38rem 0.9rem;
    }

    /* Stats row */
    .stats-row {
      display: flex; gap: 1.8rem; justify-content: center;
    }
    .stat-chip { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-chip .lbl {
      font-size: 0.58rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    .stat-chip .val {
      font-size: 0.92rem; font-weight: 600; color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Footer buttons */
    .footer-btns { display: flex; gap: 0.5rem; width: 100%; }
    .btn {
      font-family: 'Outfit', sans-serif; font-size: 0.88rem;
      font-weight: 700; flex: 1;
      padding: 0.72rem 0.9rem; border: none;
      border-radius: 10px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      letter-spacing: 0.01em;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--text); color: var(--bg);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(241,245,249,0.2); }

    .btn-again {
      background: rgba(59,130,246,0.14); color: var(--result);
      border: 1px solid rgba(59,130,246,0.25);
    }
    .btn-again:hover { background: rgba(59,130,246,0.24); }

    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid rgba(148,163,184,0.2);
      flex: 0 0 auto; font-size: 0.75rem;
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(148,163,184,0.4); background: rgba(148,163,184,0.08); }

    .hidden { display: none !important; }

    /* ── Responsive ── */
    @media (max-width: 420px) {
      #card { border-radius: 18px; }
      #card-footer { padding: 0.8rem 1rem; gap: 0.6rem; }
      .stats-row { gap: 1.2rem; }
      .game-logo { font-size: 1.7rem; }
    }
    @media (max-height: 680px) {
      #ui { gap: 0.5rem; }
      .game-logo { font-size: 1.65rem; }
      .rating-guide { padding: 0.5rem 0.85rem; gap: 0.25rem; }
      #game-zone { min-height: 120px; padding: 1.1rem; }
      #card-footer { padding: 0.7rem 1.2rem; gap: 0.55rem; }
    }
  </style>
</head>
<body>

<canvas id="canvas3d"></canvas>

<div id="ui">

  <!-- Instructions: title + rating guide, visible only in IDLE -->
  <div id="instructions">
    <h1 class="game-logo">Reaction Timer</h1>
    <p class="game-tagline">How fast are your reflexes?</p>
    <div class="rating-guide">
      <div class="rg-row"><span class="rg-dot" style="background:#34D399"></span><span class="rg-label">Amazing</span><span class="rg-range">&lt; 200 ms</span></div>
      <div class="rg-row"><span class="rg-dot" style="background:var(--ready)"></span><span class="rg-label">Very Good</span><span class="rg-range">200 – 250 ms</span></div>
      <div class="rg-row"><span class="rg-dot" style="background:var(--result)"></span><span class="rg-label">Good</span><span class="rg-range">250 – 300 ms</span></div>
      <div class="rg-row"><span class="rg-dot" style="background:var(--waiting)"></span><span class="rg-label">Average</span><span class="rg-range">300 – 400 ms</span></div>
      <div class="rg-row"><span class="rg-dot" style="background:var(--error)"></span><span class="rg-label">Below Average</span><span class="rg-range">400 ms+</span></div>
    </div>
  </div>

  <!-- Game card -->
  <div id="card">

    <!-- Game zone: the clickable area, no text during play -->
    <div id="game-zone">

      <!-- IDLE: subtle tap prompt -->
      <div class="panel active" id="p-idle">
        <div class="idle-ring"></div>
        <span class="idle-label">Click to start</span>
      </div>

      <!-- WAITING: spinner only -->
      <div class="panel" id="p-waiting">
        <div class="orbit-loader"></div>
      </div>

      <!-- READY: beacon only -->
      <div class="panel" id="p-ready">
        <div class="ready-beacon"></div>
      </div>

      <!-- RESULT: time + rating -->
      <div class="panel" id="p-result">
        <p class="result-label">Reaction Time</p>
        <div class="result-number">
          <span id="r-ms">—</span><span class="result-unit"> ms</span>
        </div>
        <span class="rating-pill" id="r-rating"></span>
      </div>

      <!-- FALSE: icon only, message shown in footer -->
      <div class="panel" id="p-false">
        <div class="false-icon">⚡</div>
      </div>

    </div><!-- /#game-zone -->

    <!-- Card footer: stats + controls, never a game click target -->
    <div id="card-footer">

      <!-- Too Early notice (bottom of box, shown only on false start) -->
      <div id="false-notice" class="hidden">Too Early — wait for the shape to turn green.</div>

      <!-- Session stats, centered -->
      <div class="stats-row">
        <div class="stat-chip">
          <span class="lbl">Attempts</span>
          <span class="val" id="s-att">0</span>
        </div>
        <div class="stat-chip">
          <span class="lbl">Best</span>
          <span class="val" id="s-best">—</span>
        </div>
        <div class="stat-chip">
          <span class="lbl">Average</span>
          <span class="val" id="s-avg">—</span>
        </div>
      </div>

      <!-- Buttons -->
      <div class="footer-btns">
        <button class="btn btn-primary" id="btn-start"  onclick="beginGame()">&#9654;&nbsp; Start Game</button>
        <button class="btn btn-again   hidden" id="btn-again"  onclick="beginGame()">Play Again</button>
        <button class="btn btn-ghost"  id="btn-reset"  onclick="resetAll()">Reset</button>
      </div>

    </div><!-- /#card-footer -->

  </div><!-- /#card -->

</div><!-- /#ui -->

<script>
'use strict';

/* ═══════════════════════════════════════════
   THREE.JS SCENE
═══════════════════════════════════════════ */

const canvas3d = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding   = THREE.sRGBEncoding;
renderer.toneMapping      = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0F172A);
scene.fog = new THREE.FogExp2(0x0F172A, 0.036);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 80);
camera.position.z = 7;

scene.add(new THREE.AmbientLight(0x1E293B, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 6, 5);
scene.add(sun);

const accentA = new THREE.PointLight(0x3B82F6, 5, 20);
accentA.position.set(-4, 2, 4);
scene.add(accentA);

const accentB = new THREE.PointLight(0x3B82F6, 3, 14);
accentB.position.set(4, -3, 3);
scene.add(accentB);

const mainGeo = new THREE.TorusKnotGeometry(1.35, 0.42, 160, 18, 2, 3);
const mainMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0x3B82F6), emissive: new THREE.Color(0x0d1f4a),
  emissiveIntensity: 0.7, metalness: 0.85, roughness: 0.12,
});
const mainMesh = new THREE.Mesh(mainGeo, mainMat);
scene.add(mainMesh);

const wireGeo = new THREE.TorusKnotGeometry(1.38, 0.43, 80, 12, 2, 3);
const wireMat = new THREE.MeshBasicMaterial({ color: 0x60A5FA, wireframe: true, transparent: true, opacity: 0.09 });
const wireMesh = new THREE.Mesh(wireGeo, wireMat);
scene.add(wireMesh);

const pCount = 380;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  const r = 9 + Math.random() * 14;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  pPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  pPos[i*3+2] = r * Math.cos(phi);
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x94A3B8, size: 0.045, transparent: true, opacity: 0.42 })));

const PALETTE = {
  idle:        { color: 0x3B82F6, emissive: 0x0d1f4a, light: 0x3B82F6, li: 5 },
  waiting:     { color: 0xF59E0B, emissive: 0x4d2f00, light: 0xD97706, li: 6 },
  ready:       { color: 0x10B981, emissive: 0x043b28, light: 0x10B981, li: 9 },
  result:      { color: 0x3B82F6, emissive: 0x0d1f4a, light: 0x3B82F6, li: 5 },
  false_start: { color: 0xEF4444, emissive: 0x4a0808, light: 0xEF4444, li: 7 },
};

const tColor = new THREE.Color(0x3B82F6), tEmissive = new THREE.Color(0x0d1f4a);
const tLight = new THREE.Color(0x3B82F6), cLight    = new THREE.Color(0x3B82F6);
let tLightInt = 5;

function setPalette(key) {
  const p = PALETTE[key];
  tColor.setHex(p.color); tEmissive.setHex(p.emissive);
  tLight.setHex(p.light); tLightInt = p.li;
}

/* ═══════════════════════════════════════════
   GAME STATE MACHINE
═══════════════════════════════════════════ */

const S    = { IDLE: 0, WAITING: 1, READY: 2, RESULT: 3, FALSE: 4 };
const PKEY = ['idle', 'waiting', 'ready', 'result', 'false_start'];

let gState = S.IDLE, waitTimer = null, reactStart = null;
let session = { n: 0, times: [] };

const panelEls = {
  [S.IDLE]:    document.getElementById('p-idle'),
  [S.WAITING]: document.getElementById('p-waiting'),
  [S.READY]:   document.getElementById('p-ready'),
  [S.RESULT]:  document.getElementById('p-result'),
  [S.FALSE]:   document.getElementById('p-false'),
};

const gameZone    = document.getElementById('game-zone');
const card        = document.getElementById('card');
const instructions = document.getElementById('instructions');
const falseNotice  = document.getElementById('false-notice');
const btnStart     = document.getElementById('btn-start');
const btnAgain     = document.getElementById('btn-again');
const elMs  = document.getElementById('r-ms');
const elRate = document.getElementById('r-rating');
const elAtt  = document.getElementById('s-att');
const elBest = document.getElementById('s-best');
const elAvg  = document.getElementById('s-avg');

const CARD_STYLE = {
  idle:        { border: 'rgba(148,163,184,0.12)', glow: '' },
  waiting:     { border: 'rgba(245,158,11,0.4)',   glow: ', 0 0 50px rgba(245,158,11,0.09)' },
  ready:       { border: 'rgba(16,185,129,0.55)',  glow: ', 0 0 65px rgba(16,185,129,0.18)' },
  result:      { border: 'rgba(59,130,246,0.4)',   glow: ', 0 0 50px rgba(59,130,246,0.1)'  },
  false_start: { border: 'rgba(239,68,68,0.5)',    glow: ', 0 0 50px rgba(239,68,68,0.1)'   },
};

function showPanel(s) {
  Object.values(panelEls).forEach(p => p.classList.remove('active'));
  panelEls[s].classList.add('active');
}

function applyCardStyle(key) {
  const cs = CARD_STYLE[key];
  const base = '0 4px 6px rgba(0,0,0,0.15),0 20px 40px rgba(0,0,0,0.38)';
  card.style.borderColor = cs.border;
  card.style.boxShadow   = base + cs.glow;
}

function go(s) {
  gState = s;
  const key = PKEY[s];
  showPanel(s);
  setPalette(key);
  applyCardStyle(key);

  /* Instructions only visible in IDLE */
  instructions.classList.toggle('hidden', s !== S.IDLE);

  /* False notice only in FALSE state */
  falseNotice.classList.toggle('hidden', s !== S.FALSE);

  /* Primary action button */
  btnStart.classList.toggle('hidden', s !== S.IDLE);
  btnAgain.classList.toggle('hidden', s !== S.RESULT && s !== S.FALSE);

  /* Pointer cursor when zone accepts clicks */
  gameZone.classList.toggle('clickable', s === S.IDLE || s === S.WAITING || s === S.READY);
}

function beginGame() {
  clearTimeout(waitTimer);
  go(S.WAITING);
  const delay = 1000 + Math.random() * 4000;
  waitTimer = setTimeout(() => {
    go(S.READY);
    reactStart = performance.now();
  }, delay);
}

function onGameClick(e) {
  const now = performance.now(); /* Capture immediately */
  if (e.target && e.target.closest && e.target.closest('button')) return;

  if      (gState === S.IDLE)    { beginGame(); }
  else if (gState === S.WAITING) { clearTimeout(waitTimer); playFalse(); go(S.FALSE); }
  else if (gState === S.READY)   {
    const elapsed = now - reactStart;
    session.n++;
    session.times.push(elapsed);
    updateStats();
    renderResult(elapsed);
    playResult(elapsed);
    go(S.RESULT);
  }
}

function renderResult(ms) {
  elMs.textContent = Math.round(ms);
  let label, cls;
  if      (ms < 150) { label = 'Superhuman ⚡'; cls = 'r-elite'; }
  else if (ms < 200) { label = 'Amazing';        cls = 'r-elite'; }
  else if (ms < 250) { label = 'Very Good';      cls = 'r-excellent'; }
  else if (ms < 300) { label = 'Good';           cls = 'r-great'; }
  else if (ms < 400) { label = 'Average';        cls = 'r-average'; }
  else if (ms < 600) { label = 'Below Average';  cls = 'r-average'; }
  else               { label = 'Keep Practicing'; cls = 'r-slow'; }
  elRate.textContent = label;
  elRate.className   = 'rating-pill ' + cls;
}

function updateStats() {
  const { n, times } = session;
  elAtt.textContent = n;
  if (times.length) {
    elBest.textContent = Math.round(Math.min(...times)) + ' ms';
    elAvg.textContent  = Math.round(times.reduce((a,b) => a+b, 0) / times.length) + ' ms';
  }
}

function resetAll() {
  clearTimeout(waitTimer);
  session = { n: 0, times: [] };
  elAtt.textContent = '0'; elBest.textContent = '—'; elAvg.textContent = '—';
  go(S.IDLE);
}

/* Game clicks confined to the game zone */
gameZone.addEventListener('mousedown',  onGameClick);
gameZone.addEventListener('touchstart', onGameClick, { passive: true });

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  e.preventDefault();
  if      (gState === S.IDLE)                          beginGame();
  else if (gState === S.WAITING || gState === S.READY) onGameClick({ target: null });
  else if (gState === S.RESULT  || gState === S.FALSE) beginGame();
});

window.addEventListener('contextmenu', e => e.preventDefault());

/* Initialise UI state */
go(S.IDLE);

/* ═══════════════════════════════════════════
   WEB AUDIO
═══════════════════════════════════════════ */

let audioCtx = null;
function getAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {}
  return audioCtx;
}

function tone(freq, dur, type, vol) {
  const ctx = getAudio(); if (!ctx) return;
  try {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(_) {}
}

function playFalse() {
  tone(110, 0.32, 'sawtooth', 0.16);
  setTimeout(() => tone(85, 0.22, 'sawtooth', 0.1), 110);
}

function playResult(ms) {
  const f = Math.min(1500, Math.max(280, 1900 - ms * 2.2));
  tone(f, 0.08, 'sine', 0.14);
  setTimeout(() => tone(f * 1.26, 0.16, 'sine', 0.1), 65);
}

/* ═══════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════ */

const clock = new THREE.Clock();
let smoothScale = 1;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.getElapsedTime();

  const rs = gState===S.WAITING?0.6 : gState===S.READY?2.8 : gState===S.FALSE?0.18 : gState===S.RESULT?0.32 : 0.42;
  mainMesh.rotation.x += dt * rs * 0.5;
  mainMesh.rotation.y += dt * rs * 0.72;
  wireMesh.rotation.x -= dt * rs * 0.36;
  wireMesh.rotation.y -= dt * rs * 0.5;

  const sTarget = gState===S.READY ? 1+Math.sin(t*12)*0.08 : gState===S.WAITING ? 1+Math.sin(t*3)*0.04 : gState===S.FALSE ? 1+Math.abs(Math.sin(t*22))*0.05 : 1;
  smoothScale += (sTarget - smoothScale) * 0.13;
  mainMesh.scale.setScalar(smoothScale);
  wireMesh.scale.setScalar(smoothScale * 1.013);

  const L = 0.055;
  mainMat.color.lerp(tColor, L);
  mainMat.emissive.lerp(tEmissive, L);
  cLight.lerp(tLight, L);
  accentA.color.copy(cLight); accentB.color.copy(cLight);
  accentA.intensity += (tLightInt       - accentA.intensity) * 0.07;
  accentB.intensity += (tLightInt * 0.6 - accentB.intensity) * 0.07;
  wireMat.color.lerp(tColor, L * 0.65);

  camera.position.x = Math.sin(t * 0.17) * 0.35;
  camera.position.y = Math.cos(t * 0.11) * 0.22;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
